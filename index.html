<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НУЛЬ КАКАШКА</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
        <h1 class="site-title">НУЛЬ КАКАШКА</h1>
    </header>

    <nav class="side-menu" id="sideMenu">
        <div class="menu-header"><h2>Меню</h2><button class="close-btn" id="closeBtn">&times;</button></div>
        <ul class="menu-list">
            <li><a href="kordelia.html">Корделия</a></li>
            <li><a href="sanya.html">Саня и Лори</a></li>
            <li><a href="ginger.html">Ginger</a></li>
            <li><a href="disha.html">Диша</a></li>
            <li><a href="vitelka.html">Вителька</a></li>
            <li><a href="probel.html">Пробел</a></li>
            <li><a href="me.html">Лично от меня</a></li>
        </ul>
    </nav>
    <div class="overlay" id="overlay"></div>

    <main class="content">
        <section class="hero">
            <div class="gif-container">
                <!-- Гифка -->
                <img src="images/gif.png" alt="Гифка" class="welcome-gif">
            </div>
            <h2 class="hero-title">С твоим днём!</h2>
            <p class="hero-subtitle">Открой меню слева, чтобы увидеть поздравления.</p>
        </section>

                <!-- КАЗИК (СЛОТ-МАШИНА) -->
        <div class="machine-wrapper">
            <div class="slot-machine">
                
                <!-- ВОТ НАШИ ЛАМПОЧКИ -->
                <div class="bulb bulb-1"></div>
                <div class="bulb bulb-2"></div>
                <div class="bulb bulb-3"></div>
                <div class="bulb bulb-4"></div>
                <div class="bulb bulb-5"></div>
                <div class="bulb bulb-6"></div>
                <div class="bulb bulb-7"></div>
                <div class="bulb bulb-8"></div>

                <div class="machine-body">
                    <h3 class="machine-title">LUCKY BIRTHDAY</h3>
                    <div class="screen">
                        <div class="slots-container">
                            <div class="slot" id="slot1">🍒</div>
                            <div class="slot" id="slot2">💎</div>
                            <div class="slot" id="slot3">🍋</div>
                        </div>
                    </div>
                    <div class="slot-message" id="slot-message">Нажми SPIN!</div>
                </div>
                <button id="spin-btn" class="casino-btn">SPIN</button>
            </div>
        </div>

        <!-- КАНВАС ДЛЯ САЛЮТА (добавляем в самый конец main) -->
        <canvas id="fireworksCanvas"></canvas>
    </main>

    <script src="script.js"></script>
</body>
</html>
